<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Agent Skills Catalog — animated terminal installing skills">
  <style>
    .mono { font-family: "SF Mono", "Cascadia Code", Consolas, Menlo, monospace; }
    .dim    { fill: #8b949e; }
    .green  { fill: #3fb950; }
    .blue   { fill: #79c0ff; }
    .fg     { fill: #e6edf3; }

    @keyframes reveal { to { width: 0; } }
    .cover { fill: #10151c; }
    .l1 { animation: reveal 1.1s steps(22) 0.4s forwards; }
    .l2 { animation: reveal 0.9s steps(18) 1.9s forwards; }
    .l3 { animation: reveal 0.01s linear 3.2s forwards; }
    .l4 { animation: reveal 0.01s linear 3.7s forwards; }
    .l5 { animation: reveal 0.01s linear 4.2s forwards; }
    .l6 { animation: reveal 0.01s linear 4.7s forwards; }

    @keyframes blink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
    .cursor { animation: blink 1s step-end infinite; }

    @keyframes chippop {
      0%   { opacity: 0; transform: translateY(6px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    .chip  { opacity: 0; animation: chippop 0.45s cubic-bezier(.2,.7,.3,1) forwards; }
    .c1 { animation-delay: 3.3s; } .c2 { animation-delay: 3.55s; }
    .c3 { animation-delay: 3.8s; } .c4 { animation-delay: 4.05s; }
    .c5 { animation-delay: 4.3s; } .c6 { animation-delay: 4.55s; }

    @keyframes drift { 0% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: -28; } }
    .flow { stroke-dasharray: 4 10; animation: drift 2.2s linear infinite; }

    @keyframes glow { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
    .node { animation: glow 2.6s ease-in-out infinite; }
    .n2 { animation-delay: .6s; } .n3 { animation-delay: 1.2s; } .n4 { animation-delay: 1.8s; }
  </style>

  <!-- panel -->
  <rect x="0" y="0" width="1200" height="300" rx="16" fill="#10151c"/>
  <rect x="0.5" y="0.5" width="1199" height="299" rx="16" fill="none" stroke="#30363d"/>

  <!-- ambient node wiring, right side -->
  <g fill="none">
    <path class="flow" d="M760 190 C 830 150, 900 210, 985 150" stroke="#233041" stroke-width="1.5"/>
    <path class="flow" d="M760 205 C 850 228, 950 215, 1060 198" stroke="#233041" stroke-width="1.5" style="animation-delay:.8s"/>
  </g>
  <g>
    <circle class="node"    cx="985"  cy="150" r="4" fill="#3fb950"/>
    <circle class="node n2" cx="1060" cy="205" r="4" fill="#79c0ff"/>
    <circle class="node n3" cx="905"  cy="218" r="3" fill="#8b949e"/>
    <circle class="node n4" cx="1105" cy="120" r="3" fill="#8b949e"/>
  </g>

  <!-- terminal card -->
  <g>
    <rect x="48" y="42" width="660" height="216" rx="12" fill="#0b0f14" stroke="#30363d"/>
    <circle cx="76" cy="68" r="5.5" fill="#f85149"/>
    <circle cx="96" cy="68" r="5.5" fill="#d29922"/>
    <circle cx="116" cy="68" r="5.5" fill="#3fb950"/>
    <text x="378" y="72" text-anchor="middle" class="mono dim" font-size="12">agent — skills</text>

    <!-- line 1: prompt -->
    <text x="76" y="112" class="mono fg" font-size="16"><tspan class="green">$</tspan> ./install.sh</text>
    <rect class="cover l1" x="76" y="98" width="220" height="20"/>

    <!-- line 2 -->
    <text x="76" y="142" class="mono dim" font-size="15">reading skills.json …</text>
    <rect class="cover l2" x="76" y="128" width="240" height="20"/>

    <!-- lines 3-6 -->
    <text x="76" y="172" class="mono fg" font-size="15"><tspan class="green">✓</tspan> 19 skills found — <tspan class="blue">pick yours</tspan></text>
    <rect class="cover l3" x="76" y="158" width="330" height="20"/>

    <text x="76" y="202" class="mono dim" font-size="15">installed → ~/.claude/skills/</text>
    <rect class="cover l4" x="76" y="188" width="320" height="20"/>

    <text x="76" y="232" class="mono dim" font-size="15">works with Claude Code + Codex CLI</text>
    <rect class="cover l5" x="76" y="218" width="360" height="20"/>

    <rect class="cursor" x="446" y="220" width="9" height="16" fill="#3fb950"/>
  </g>

  <!-- skill chips, right side -->
  <g class="mono" font-size="14">
    <g class="chip c1">
      <rect x="760" y="58" width="130" height="34" rx="17" fill="#132218" stroke="#238636"/>
      <text x="825" y="80" text-anchor="middle" class="green">verify-work</text>
    </g>
    <g class="chip c2">
      <rect x="906" y="58" width="160" height="34" rx="17" fill="#0f1c2d" stroke="#1f6feb"/>
      <text x="986" y="80" text-anchor="middle" class="blue">security-pass</text>
    </g>
    <g class="chip c3">
      <rect x="760" y="104" width="176" height="34" rx="17" fill="#161b22" stroke="#30363d"/>
      <text x="848" y="126" text-anchor="middle" class="fg">safe-data-write</text>
    </g>
    <g class="chip c4">
      <rect x="952" y="104" width="130" height="34" rx="17" fill="#161b22" stroke="#30363d"/>
      <text x="1017" y="126" text-anchor="middle" class="fg">app-audit</text>
    </g>
    <g class="chip c5">
      <rect x="760" y="150" width="210" height="34" rx="17" fill="#161b22" stroke="#30363d"/>
      <text x="865" y="172" text-anchor="middle" class="fg">pre-release-review</text>
    </g>
    <g class="chip c6">
      <rect x="986" y="150" width="120" height="34" rx="17" fill="#1d1526" stroke="#8957e5"/>
      <text x="1046" y="172" text-anchor="middle" fill="#d2a8ff">+14 more</text>
    </g>
  </g>

  <!-- footer strapline -->
  <text x="760" y="242" class="mono dim" font-size="13">point your agent here → it lists, you pick, it installs</text>
</svg>
